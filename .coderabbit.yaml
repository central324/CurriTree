
# CodeRabbit 리뷰 언어 설정
language: "ko-KR"

reviews:
  # 코드 리뷰 강도: quiet / chill / assertive
  profile: "chill"

  # 초기 테스트에서는 AI 자동 승인을 사용하지 않습니다.
  request_changes_workflow: false

  # 리뷰 결과 및 진행 상태 표시
  high_level_summary: true
  review_status: true

  auto_review:
    # PR 생성 시 자동 리뷰 요청
    enabled: true

    # PR에 새 커밋이 추가되면 변경 사항 재검토
    auto_incremental_review: true

    # 5개 커밋 리뷰 후 자동 일시정지
    auto_pause_after_reviewed_commits: 5

    # Draft PR은 자동 리뷰 대상에서 제외
    drafts: false
